name: maintenance

# Everything that used to need a laptop, as a button.
#
# On 2026-09-10 the database hit its 500MB ceiling and went read-only. Every
# recovery path -- reload, trim, republish -- ran through one person's Windows
# machine, and that machine was about to be a thousand miles away for eleven days.
# That is the actual single point of failure the incident exposed; the disk was
# just what revealed it.
#
# The secrets this needs are already in the repository, so a runner can do
# everything the laptop did. Trigger it from Actions -> maintenance -> Run
# workflow, which works fine in a phone browser.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        required: true
        default: report
        options:
          - report                # read-only: what is in the database right now
          - reload-prices         # refill prices_daily from the committed CSVs
          - republish-screens     # recompute and republish from whatever prices exist
          - reload-and-republish  # both, in order
          - prune                 # drop price history past the retention window
          - invite                # create accounts for invited users (no email sent)
          - backfill-mirror       # re-mirror a wide window into history/appends
      since:
        description: "Earliest bar to load (YYYY-MM-DD). Ignored unless reloading."
        type: string
        required: false
        default: "2023-09-01"
      emails:
        description: "Comma-separated addresses to create accounts for. Only used by 'invite'."
        type: string
        required: false
        default: ""
      window:
        description: "Days back to re-mirror. Only used by 'backfill-mirror'."
        type: string
        required: false
        default: "40"

# Never let two of these overlap, and never let one cancel another mid-write.
concurrency:
  group: meridian-database
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Only backfill-mirror writes to the repository, and only ever under
    # history/appends -- but the permission is per job, so every task in this workflow
    # carries it. That is the cost of putting the backfill here rather than in a
    # workflow of its own; the commit step below is the same one the nightly uses and
    # stages that one directory by name.
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fail early if the secrets are missing
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY must be set as repository secrets."
            exit 1
          fi

      - run: npm install --no-save @supabase/supabase-js

      # Always, whatever the task: say what is in the database before touching it.
      # A maintenance run that does not show its starting state is a run you cannot
      # reason about afterwards.
      - name: Report — before
        run: node db_report.mjs

      # Creates accounts directly; sends nothing. Supabase's built-in email refuses
      # addresses outside the project's team and is capped at 2/hour, so a dashboard
      # invite to an outside address does not arrive at all — and custom SMTP needs the
      # sending domain that has not been bought yet (§8).
      #
      # INVITE_PASSWORD is required here and the script refuses without it: this
      # repository is public, so a generated password printed in the run log would be a
      # live credential published to the world. A secret is masked by Actions, and the
      # owner already knows its value.
      - name: Create accounts for invited users
        if: ${{ inputs.task == 'invite' }}
        env:
          INVITE_PASSWORD: ${{ secrets.INVITE_PASSWORD }}
          # Through the environment, never interpolated into the command line.
          # `${{ }}` is substituted into the shell script BEFORE the shell parses it, so
          # an input containing a quote and a semicolon would run as a second command.
          # Only collaborators can dispatch this, which bounds it rather than fixing it.
          EMAILS: ${{ inputs.emails }}
        run: node invite_users.mjs --emails "$EMAILS"

      - name: Reload prices
        if: ${{ inputs.task == 'reload-prices' || inputs.task == 'reload-and-republish' }}
        run: |
          echo "loading bars from ${{ inputs.since }} onward"
          node --max-old-space-size=4096 load_supabase.mjs --since "${{ inputs.since }}"

      - name: Republish screens
        if: ${{ inputs.task == 'republish-screens' || inputs.task == 'reload-and-republish' }}
        run: node --max-old-space-size=6144 compute_and_publish.mjs --from-db

      - name: Prune price history past the retention window
        if: ${{ inputs.task == 'prune' }}
        run: node prune_prices.mjs

      # THE MIRROR BACKFILL. The nightly already re-examines a trailing window and
      # emits whatever the mirror never received (§11r); this is the same code with the
      # window opened wide enough to reach days that fell out of it before the fix
      # shipped. Nothing special happens here — which is the point, because a
      # one-off script written for a one-off problem is a script nobody has run twice.
      - name: Backfill the git price mirror
        if: ${{ inputs.task == 'backfill-mirror' }}
        env:
          MIRROR_WINDOW_DAYS: ${{ inputs.window }}
        run: node --max-old-space-size=4096 append_history.mjs

      - name: Commit the backfill
        if: ${{ inputs.task == 'backfill-mirror' }}
        run: |
          set -e
          git config user.name  "meridian-maintenance"
          git config user.email "noreply@github.com"
          git add history/appends
          if git diff --cached --quiet; then
            echo "the mirror was already complete over that window"
            exit 0
          fi
          git commit -m "Backfill the price mirror (${{ inputs.window }}-day window)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"
            sleep $((2 ** i))
          done
          echo "::error::could not push the mirror backfill after 4 attempts"
          exit 1

      - name: Report — after
        if: ${{ always() && inputs.task != 'report' }}
        run: node db_report.mjs
